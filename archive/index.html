<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#050505" />
  <title>DCUT Archive</title>
  <style>
    :root{
      --bg:#060606;
      --panel:#c5c8c8;
      --panel-dark:#7e8282;
      --panel-deep:#3b4040;
      --screen:#0b0c0b;
      --text:#101314;
      --text-light:#f6f6ef;
      --blue:#123766;
      --select:#1b4d8d;
      --red:#f25a63;
      --green:#57c894;
      --yellow:#ddb74f;
      --purple:#6470ff;
      --black:#000;
      --window-shadow: 8px 8px 0 rgba(0,0,0,.58);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);font-family:"MS Sans Serif","Tahoma","Geneva",sans-serif;-webkit-font-smoothing:none;image-rendering:pixelated}
    body{overflow:hidden}
    button,input,textarea{font:inherit}
    a{color:inherit}

    .archive-cursor{position:fixed;left:0;top:0;width:16px;height:16px;pointer-events:none;z-index:9999;opacity:0;transform:translate(-50%,-50%)}
    .archive-cursor.visible{opacity:1}
    .archive-cursor::before{content:"";position:absolute;left:0;top:0;width:0;height:0;border-left:12px solid #fff;border-top:12px solid #fff;border-right:12px solid transparent;border-bottom:12px solid transparent;clip-path:polygon(0 0, 0 100%, 45% 72%, 58% 100%, 72% 94%, 58% 66%, 100% 66%);} 
    .archive-cursor::after{content:"";position:absolute;left:1px;top:1px;width:0;height:0;border-left:10px solid #000;border-top:10px solid #000;border-right:10px solid transparent;border-bottom:10px solid transparent;clip-path:polygon(0 0, 0 100%, 45% 72%, 58% 100%, 72% 94%, 58% 66%, 100% 66%);} 
    .archive-cursor.hovering{filter:drop-shadow(0 0 3px rgba(255,255,255,.7))}
    @media (hover:hover) and (pointer:fine){ body, button, a, .desktop-icon, .window-btn, .start-btn, .task-button {cursor:none !important} }

    .desktop-shell{height:100vh;padding:18px;background:#040404;display:flex;align-items:center;justify-content:center}
    .monitor{width:min(1220px, 100%);height:min(92vh, 900px);display:grid;grid-template-rows:1fr auto;filter:drop-shadow(0 28px 60px rgba(0,0,0,.72))}
    .monitor-screen{position:relative;overflow:hidden;border:4px solid #161616;background:#0d0d0d;box-shadow:0 0 0 3px #5e6464, 0 0 0 8px #1d2020, inset 0 0 0 3px #0d0f0f, inset 0 0 0 10px #272b2b}
    .monitor-bottom{padding:10px 14px;background:linear-gradient(180deg,#737979,#464b4b);border:4px solid #171919;border-top:0;color:#d9ddd7;display:flex;align-items:center;justify-content:space-between;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
    .monitor-stand{width:210px;height:20px;background:linear-gradient(180deg,#6e7474,#434848);margin:0 auto;border:4px solid #181a1a;border-top:0}
    .monitor-foot{width:330px;height:22px;background:linear-gradient(180deg,#596060,#3c4040);margin:0 auto;border:4px solid #171919;border-top:0}

    .desktop-area{position:absolute;inset:0;background:#050505;overflow:hidden}
    .wallpaper-layer{position:absolute;inset:0;background-image:linear-gradient(rgba(0,0,0,.34), rgba(0,0,0,.36)), url('/assets/archive-wallpaper.jpg');background-size:cover;background-position:center;filter:saturate(.85) contrast(.96) brightness(.8)}
    .wallpaper-layer::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom, rgba(255,255,255,.08) 0 1px, transparent 1px 4px), linear-gradient(90deg, rgba(255,0,30,.035), transparent 10%, transparent 90%, rgba(0,90,255,.04));opacity:.35;mix-blend-mode:screen}
    .wallpaper-layer::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center, transparent 38%, rgba(0,0,0,.52) 100%), linear-gradient(180deg, transparent 0%, rgba(255,255,255,.07) 12%, transparent 24%, transparent 74%, rgba(255,255,255,.05) 83%, transparent 100%);pointer-events:none}
    .vhs-overlay{position:absolute;inset:0;pointer-events:none;z-index:1}
    .vhs-overlay::before{content:"PLAY  SP";position:absolute;left:16px;top:14px;color:#f2f2ee;font-size:12px;letter-spacing:.12em;text-shadow:1px 1px 0 #000;opacity:.82}
    .vhs-overlay::after{content:"DCUT_ARCHIVE  12:00 PM";position:absolute;right:16px;bottom:34px;color:#f0f0ea;font-size:12px;letter-spacing:.08em;text-shadow:1px 1px 0 #000;opacity:.8}
    .tracking{position:absolute;left:0;right:0;height:20px;background:linear-gradient(180deg, rgba(255,255,255,.08), transparent);opacity:.28;top:12%;animation:tracking 7s linear infinite}
    .noise{position:absolute;inset:-30%;background-image:radial-gradient(rgba(255,255,255,.22) .45px, transparent .7px);background-size:5px 5px;opacity:.07;animation:noiseDrift 10s linear infinite}
    .rgb-split{position:absolute;inset:0;background:linear-gradient(90deg, rgba(255,0,50,.045), transparent 32%, transparent 68%, rgba(0,120,255,.045));mix-blend-mode:screen;opacity:.25}

    .desktop-header{position:absolute;left:0;right:0;top:0;height:28px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg, rgba(10,12,12,.88), rgba(10,12,12,.68));border-bottom:1px solid rgba(255,255,255,.08);color:#dbe0d8;font-size:11px;letter-spacing:.1em;text-transform:uppercase;z-index:3}
    .desktop-title{display:flex;align-items:center;gap:8px}
    .status-light{width:8px;height:8px;background:#57c894;box-shadow:0 0 0 2px rgba(17,54,36,.75), 0 0 8px rgba(87,200,148,.38)}

    .icons-region{position:absolute;inset:42px 16px 46px 16px;z-index:2;display:flex;align-items:flex-start;justify-content:flex-start}
    .icon-grid{display:grid;grid-template-columns:repeat(2, 112px);grid-auto-rows:min-content;gap:18px 14px;align-content:start}
    .desktop-icon{background:transparent;border:0;padding:2px;display:flex;flex-direction:column;align-items:center;gap:6px;width:112px;color:#fff;text-shadow:1px 1px 0 #000}
    .desktop-icon.selected .icon-label{background:rgba(22,73,141,.78);outline:1px dotted #eff2ff}
    .desktop-icon .icon-label{padding:2px 5px;font-size:12px;line-height:1.15;text-align:center;max-width:100%;overflow-wrap:anywhere}
    .desktop-icon:hover .icon-sprite{transform:translateY(-1px)}
    .icon-sprite{width:46px;height:46px;position:relative;transition:transform .08s steps(2,end)}
    .icon-sprite.file::before{content:"";position:absolute;left:8px;top:4px;width:26px;height:34px;background:#f1f1e8;border:2px solid #53595a;box-shadow:inset -4px -4px 0 #d3d7d8}
    .icon-sprite.file::after{content:"";position:absolute;right:8px;top:4px;width:10px;height:10px;background:#dde0e1;border-top:2px solid #53595a;border-right:2px solid #53595a;clip-path:polygon(0 0, 100% 0, 100% 100%)}
    .icon-sprite.video::before,.icon-sprite.video::after,.icon-sprite.image::before,.icon-sprite.image::after,.icon-sprite.pong::before,.icon-sprite.pong::after,.icon-sprite.folder::before,.icon-sprite.folder::after{content:"";position:absolute}
    .icon-sprite.folder::before{left:3px;top:12px;width:38px;height:24px;background:#f5c663;border:2px solid #665539;box-shadow:inset -4px -4px 0 #ddaf4f}
    .icon-sprite.folder::after{left:8px;top:8px;width:16px;height:8px;background:#f5c663;border:2px solid #665539;border-bottom:0}
    .icon-sprite.video::before{left:7px;top:8px;width:30px;height:24px;background:#151515;border:2px solid #bdc1c2;box-shadow:inset 0 0 0 2px #5b6060}
    .icon-sprite.video::after{left:18px;top:15px;width:0;height:0;border-left:10px solid #57c894;border-top:6px solid transparent;border-bottom:6px solid transparent}
    .icon-sprite.image::before{left:7px;top:7px;width:30px;height:26px;background:#f1f1e8;border:2px solid #53595a;box-shadow:inset -4px -4px 0 #d3d7d8}
    .icon-sprite.image::after{left:13px;top:21px;width:18px;height:8px;background:#57c894;clip-path:polygon(0 100%, 28% 48%, 45% 68%, 66% 28%, 100% 100%)}
    .icon-sprite.pong::before{left:5px;top:5px;width:34px;height:26px;background:#050505;border:2px solid #d1d6d5;box-shadow:inset 0 0 0 2px #4a4f4f}
    .icon-sprite.pong::after{left:16px;top:15px;width:12px;height:8px;background:linear-gradient(90deg, #f25a63 0 16%, transparent 16% 42%, #ffffff 42% 58%, transparent 58% 84%, #6470ff 84% 100%)}

    .taskbar{position:absolute;left:0;right:0;bottom:0;height:30px;background:linear-gradient(180deg,#d5d8d7,#a9afaf);border-top:2px solid #f3f4f3;display:flex;align-items:center;padding:0 6px;gap:6px;z-index:4}
    .start-btn{height:22px;padding:0 10px;border:2px solid;border-color:#fbfbfb #3d4242 #3d4242 #fbfbfb;background:#c2c7c7;display:inline-flex;align-items:center;gap:7px;font-weight:700}
    .start-logo{width:12px;height:12px;background:linear-gradient(90deg,var(--red) 0 50%, var(--blue) 50% 100%), linear-gradient(90deg,var(--green) 0 50%, var(--yellow) 50% 100%);background-size:100% 50%,100% 50%;background-position:0 0, 0 100%;background-repeat:no-repeat}
    .task-sep{width:1px;height:18px;background:#666b6b}
    .task-button{height:22px;min-width:124px;padding:0 8px;border:2px solid;border-color:#fbfbfb #3d4242 #3d4242 #fbfbfb;background:#c5caca;display:none;align-items:center;justify-content:flex-start;font-size:11px}
    .task-button.visible{display:flex}
    .clock{margin-left:auto;padding:2px 10px;height:22px;border:2px solid;border-color:#7c8181 #f5f5f5 #f5f5f5 #7c8181;background:#cfd4d3;display:flex;align-items:center;font-size:11px}

    .window-layer{position:absolute;inset:0;z-index:3;pointer-events:none}
    .window{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px, calc(100% - 70px));height:min(76%, 620px);background:#c6cbcb;border:2px solid;border-color:#f7f7f7 #4a4e4e #4a4e4e #f7f7f7;box-shadow:var(--window-shadow);display:none;flex-direction:column;pointer-events:auto}
    .window.open{display:flex}
    .window-titlebar{height:28px;background:linear-gradient(90deg, #0f3162, #2964a5);color:#f4f4ed;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 8px;font-size:12px;font-weight:700;letter-spacing:.04em}
    .window-titleleft{display:flex;align-items:center;gap:8px;min-width:0}
    .window-icon-mini{width:14px;height:14px;background:#f1f1e8;border:1px solid #1f2222;flex:none}
    .window-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .window-controls{display:flex;gap:4px}
    .window-btn{width:20px;height:20px;padding:0;border:2px solid;border-color:#fdfdfd #485050 #485050 #fdfdfd;background:#c3c8c9;font-weight:700;line-height:1}
    .window-content{flex:1;padding:14px;background:#dde0df;overflow:auto;color:#0b0d0d}
    .content-kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#495050;margin-bottom:8px}
    .content-title{font-size:27px;line-height:1;margin:0 0 12px;text-transform:uppercase;letter-spacing:.06em}
    .content-copy{font-size:14px;line-height:1.7;max-width:62ch;color:#171a1b;margin-bottom:16px}
    .content-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}
    .card{background:#eef0ef;border:2px solid;border-color:#fefefe #6b7070 #6b7070 #fefefe;padding:12px}
    .card h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em}
    .card ul{margin:0;padding-left:18px;font-size:13px;line-height:1.7}
    .meta-list{display:flex;flex-direction:column;gap:10px}
    .meta-row{display:flex;flex-direction:column;gap:4px}
    .meta-label{font-size:10px;letter-spacing:.16em;color:#566060;text-transform:uppercase}
    .meta-value{font-size:13px;line-height:1.55}
    .inline-links{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
    .inline-link{padding:7px 10px;border:2px solid;border-color:#fff #6b7070 #6b7070 #fff;background:#cdd2d2;color:#0e1112;text-decoration:none;font-size:12px}

    .pong-wrap{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:12px;height:100%}
    .pong-cabinet{background:#0a0a0a;border:2px solid #596060;padding:12px;display:flex;align-items:center;justify-content:center;position:relative}
    #pongCanvas{display:block;background:#050505;border:2px solid #8c9393;width:min(100%, 540px);aspect-ratio:4/3;image-rendering:pixelated}
    .pong-overlay{position:absolute;inset:12px;color:#d6ded6;font-size:12px;pointer-events:none}
    .pong-overlay .label{position:absolute;left:10px;top:8px;letter-spacing:.16em}
    .pong-side{display:flex;flex-direction:column;gap:10px}
    .pong-side .card{background:#e9eceb}
    .pong-btn{padding:8px 10px;border:2px solid;border-color:#fff #6b7070 #6b7070 #fff;background:#cfd5d5}
    .pong-note{font-size:12px;line-height:1.6;color:#1b1f20}

    @keyframes tracking{0%{transform:translateY(-14%)}100%{transform:translateY(560%)}}
    @keyframes noiseDrift{0%{transform:translate(0,0)}50%{transform:translate(-4%,1.5%)}100%{transform:translate(3%,-1%)}}

    @media (max-width: 920px){
      .icons-region{inset:42px 10px 46px 10px}
      .icon-grid{grid-template-columns:repeat(2, 102px)}
      .window{width:calc(100% - 30px);height:min(78%, 720px)}
      .content-grid,.pong-wrap{grid-template-columns:1fr}
    }
    @media (max-width: 640px){
      .desktop-shell{padding:6px}
      .monitor{height:96vh;width:100%}
      .monitor-bottom{font-size:10px;padding:8px}
      .desktop-header{font-size:10px;padding:0 8px}
      .icon-grid{grid-template-columns:repeat(2, 94px);gap:14px 8px}
      .desktop-icon{width:94px}
      .desktop-icon .icon-label{font-size:11px}
      .window{left:50%;top:52%;width:calc(100% - 12px);height:calc(100% - 56px)}
      .content-title{font-size:20px}
      .content-copy{font-size:12px}
      .task-button{min-width:88px;font-size:10px}
      .start-btn{padding:0 8px;font-size:11px}
    }
  </style>
</head>
<body>
  <div class="archive-cursor" id="archiveCursor" aria-hidden="true"></div>
  <main class="desktop-shell">
    <div class="monitor">
      <div class="monitor-screen">
        <div class="desktop-area">
          <div class="wallpaper-layer"></div>
          <div class="vhs-overlay"><div class="tracking"></div><div class="noise"></div><div class="rgb-split"></div></div>
          <div class="desktop-header">
            <div class="desktop-title"><span class="status-light"></span><span>DCUT_ARCHIVE_OS // DESKTOP READY</span></div>
            <div>USER: DCUTCHASE // MODE: VHS_DESKTOP</div>
          </div>
          <div class="icons-region">
            <div class="icon-grid" id="iconGrid"></div>
          </div>
          <div class="window-layer" id="windowLayer"></div>
          <div class="taskbar">
            <button class="start-btn" type="button"><span class="start-logo"></span><span>Start</span></button>
            <div class="task-sep"></div>
            <button class="task-button" type="button" id="taskButton">archive.html</button>
            <div class="clock" id="clock">12:00 PM</div>
          </div>
        </div>
      </div>
      <div class="monitor-bottom"><span>DCUT ARCHIVE // 80S COMPUTER OS</span><span>POWER: ONLINE</span></div>
      <div class="monitor-stand"></div>
      <div class="monitor-foot"></div>
    </div>
  </main>

  <template id="infoWindowTemplate">
    <article class="window" data-window="info">
      <div class="window-titlebar">
        <div class="window-titleleft"><span class="window-icon-mini"></span><span class="window-name" id="windowLabel">FILE</span></div>
        <div class="window-controls"><button class="window-btn" data-action="min">_</button><button class="window-btn" data-action="max">□</button><button class="window-btn" data-action="close">×</button></div>
      </div>
      <div class="window-content" id="windowContent"></div>
    </article>
  </template>

  <template id="pongWindowTemplate">
    <article class="window" data-window="pong">
      <div class="window-titlebar">
        <div class="window-titleleft"><span class="window-icon-mini"></span><span class="window-name">dcut_pong.exe</span></div>
        <div class="window-controls"><button class="window-btn" data-action="min">_</button><button class="window-btn" data-action="max">□</button><button class="window-btn" data-action="close">×</button></div>
      </div>
      <div class="window-content">
        <div class="pong-wrap">
          <div class="pong-cabinet">
            <canvas id="pongCanvas" width="540" height="400"></canvas>
            <div class="pong-overlay"><span class="label">DCUT_PONG.EXE</span></div>
          </div>
          <div class="pong-side">
            <section class="card"><h3>Arcade Log</h3><div class="pong-note">A small DCUT desktop game inspired by classic Pong. You control the left paddle. The right paddle is AI.</div></section>
            <section class="card"><h3>Controls</h3><ul><li>W / S move paddle</li><li>or ↑ / ↓</li><li>Space restarts</li></ul></section>
            <section class="card"><h3>Session</h3><div class="pong-note" id="pongStatus">First to 7 wins.</div><div class="inline-links"><button class="pong-btn" id="pongStartBtn" type="button">Start / Restart</button></div></section>
          </div>
        </div>
      </div>
    </article>
  </template>

  <script>
    const FILES = [
      {
        id:'file_1', type:'info', icon:'file', name:'who_is_dcutchase', title:'WHO IS DCUT CHASE', kicker:'FILE_1 // IDENTITY RECORD',
        body:'This file is ready to become your personal introduction. Use it to explain who you are, what you do, and how you approach creative work. It can hold your name, role, founder statement, and a professional summary without losing the DCUT aesthetic.',
        blocks:[
          {title:'Suggested Content', items:['Name + creative title','Short personal bio','Skills / focus areas','Founder note or personal statement']},
          {title:'Good Visuals Here', items:['Portrait of you','Behind-the-scenes still','Short intro paragraph','A clean signature quote']}
        ],
        side:[['Status','Ready for customization'],['Primary Use','About Me / Founder Intro'],['Format','Text + portrait + short note'],['Visibility','Professional overview']]
      },
      {
        id:'file_2', type:'info', icon:'folder', name:'dcut_orgins', title:'DCUT ORIGINS', kicker:'FILE_2 // BRAND ORIGIN LOG',
        body:'This file is set up to tell the story behind DCUT: what it stands for, why you created it, and what the collective is meant to become. Keep this one brand-focused and mission-driven so visitors understand the purpose behind the work.',
        blocks:[
          {title:'Suggested Content', items:['Meaning of DCUT','How the brand started','Who it is for','Core mission and values']},
          {title:'Good Visuals Here', items:['Logo / symbol usage','Early brand images','Mission statement','Key timeline notes']}
        ],
        side:[['Status','Ready for customization'],['Primary Use','Brand Story / Mission'],['Format','Text + timeline + graphics'],['Visibility','Professional brand context']]
      },
      {
        id:'file_3', type:'info', icon:'video', name:'archive_mp4', title:'ARCHIVE MP4', kicker:'FILE_3 // MOTION DIRECTORY',
        body:'This file can become a motion-based overview of your work. It is ideal for selected clips, short embeds, featured edits, music video references, or a simplified work log that complements the dedicated FILM page.',
        blocks:[
          {title:'Suggested Content', items:['Featured clips','Selected edits','Highlight reel','Motion work summary']},
          {title:'Good Visuals Here', items:['Embedded video previews','MP4 thumbnails','Short project notes','Role / credit labels']}
        ],
        side:[['Status','Ready for customization'],['Primary Use','Motion archive / reel'],['Format','Videos + short notes'],['Visibility','Selected work highlights']]
      },
      {
        id:'file_4', type:'info', icon:'image', name:'archive_jpg', title:'ARCHIVE JPG', kicker:'FILE_4 // IMAGE DIRECTORY',
        body:'This file can become an image-driven archive with photography, stills, BTS, design frames, or visual references. It is a good place for grids, contact-sheet layouts, and carefully selected static work.',
        blocks:[
          {title:'Suggested Content', items:['Photo archive','Still frames','BTS images','Design / graphic selections']},
          {title:'Good Visuals Here', items:['Contact sheets','Image grid','Captioned stills','Short context notes']}
        ],
        side:[['Status','Ready for customization'],['Primary Use','Image archive'],['Format','Gallery + captions'],['Visibility','Visual library / stills']]
      },
      {
        id:'exe_1', type:'pong', icon:'pong', name:'dcut_pong.exe'
      }
    ];

    const iconGrid = document.getElementById('iconGrid');
    const windowLayer = document.getElementById('windowLayer');
    const taskButton = document.getElementById('taskButton');
    let selectedId = null;
    let infoWindow = null;
    let pongWindow = null;
    let currentTaskLabel = 'archive.html';

    function makeIcon(item){
      const btn = document.createElement('button');
      btn.className = 'desktop-icon';
      btn.type = 'button';
      btn.dataset.id = item.id;
      btn.dataset.type = item.type;
      btn.innerHTML = `<span class="icon-sprite ${item.icon}" aria-hidden="true"></span><span class="icon-label">${item.name}</span>`;
      btn.addEventListener('click', () => selectIcon(item.id));
      btn.addEventListener('dblclick', () => openItem(item.id));
      btn.addEventListener('touchend', (e) => {
        if (window.matchMedia('(pointer:coarse)').matches) {
          e.preventDefault();
          openItem(item.id);
        }
      }, {passive:false});
      return btn;
    }

    function selectIcon(id){
      selectedId = id;
      document.querySelectorAll('.desktop-icon').forEach(el => el.classList.toggle('selected', el.dataset.id === id));
    }

    function updateTask(label, visible=true){
      currentTaskLabel = label;
      taskButton.textContent = label;
      taskButton.classList.toggle('visible', visible);
    }

    function closeAllWindows(){
      [infoWindow, pongWindow].forEach(win => { if (win) win.classList.remove('open'); });
      updateTask('archive.html', false);
    }

    function bindWindowControls(win, onClose){
      win.querySelectorAll('.window-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const action = btn.dataset.action;
          if (action === 'close') {
            win.classList.remove('open');
            if (onClose) onClose();
            const anyOpen = [...windowLayer.querySelectorAll('.window')].some(w => w.classList.contains('open'));
            updateTask('archive.html', anyOpen);
          }
          if (action === 'min') {
            win.classList.remove('open');
            updateTask('archive.html', true);
          }
          if (action === 'max') {
            win.style.width = 'calc(100% - 34px)';
            win.style.height = 'calc(100% - 70px)';
            win.style.left = '50%';
            win.style.top = '50%';
            win.style.transform = 'translate(-50%,-50%)';
          }
        });
      });
    }

    function createInfoWindow(){
      const tpl = document.getElementById('infoWindowTemplate');
      infoWindow = tpl.content.firstElementChild.cloneNode(true);
      windowLayer.appendChild(infoWindow);
      bindWindowControls(infoWindow, null);
      return infoWindow;
    }

    function renderInfoWindow(item){
      if (!infoWindow) createInfoWindow();
      infoWindow.querySelector('#windowLabel').textContent = `${item.id} // ${item.name}`;
      infoWindow.querySelector('#windowContent').innerHTML = `
        <div class="content-kicker">${item.kicker}</div>
        <h1 class="content-title">${item.title}</h1>
        <div class="content-copy">${item.body}</div>
        <div class="content-grid">
          <div>
            ${item.blocks.map(block => `<section class="card"><h3>${block.title}</h3><ul>${block.items.map(entry => `<li>${entry}</li>`).join('')}</ul></section>`).join('')}
            <div class="inline-links"><a class="inline-link" href="/">Back Home</a><a class="inline-link" href="/film/">Open Film Page</a></div>
          </div>
          <div class="meta-list">
            ${item.side.map(([label, value]) => `<section class="card meta-row"><span class="meta-label">${label}</span><span class="meta-value">${value}</span></section>`).join('')}
            <section class="card meta-row"><span class="meta-label">Page Note</span><span class="meta-value">This file is still a scaffold. Next we can replace every placeholder with your real story, mission, work log, and future plans.</span></section>
          </div>
        </div>
      `;
      infoWindow.classList.add('open');
      if (pongWindow) pongWindow.classList.remove('open');
      updateTask(item.name, true);
    }

    function createPongWindow(){
      const tpl = document.getElementById('pongWindowTemplate');
      pongWindow = tpl.content.firstElementChild.cloneNode(true);
      windowLayer.appendChild(pongWindow);
      bindWindowControls(pongWindow, null);
      setupPong(pongWindow);
      return pongWindow;
    }

    function openItem(id){
      const item = FILES.find(f => f.id === id);
      if (!item) return;
      selectIcon(id);
      if (item.type === 'pong') {
        if (!pongWindow) createPongWindow();
        pongWindow.classList.add('open');
        if (infoWindow) infoWindow.classList.remove('open');
        updateTask(item.name, true);
        startPong();
      } else {
        renderInfoWindow(item);
      }
    }

    FILES.forEach(item => iconGrid.appendChild(makeIcon(item)));
    selectIcon(FILES[0].id);
    taskButton.addEventListener('click', () => {
      const win = currentTaskLabel === 'dcut_pong.exe' ? pongWindow : infoWindow;
      if (win) win.classList.toggle('open');
    });

    function updateClock(){
      const d = new Date();
      document.getElementById('clock').textContent = d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
    }
    updateClock();
    setInterval(updateClock, 30000);

    const cursor = document.getElementById('archiveCursor');
    const fine = window.matchMedia('(hover:hover) and (pointer:fine)').matches;
    if (fine && cursor){
      let raf = null, x = 0, y = 0;
      const draw = () => { cursor.style.transform = `translate(${x}px, ${y}px)`; raf = null; };
      window.addEventListener('mousemove', e => { x = e.clientX; y = e.clientY; cursor.classList.add('visible'); if (!raf) raf = requestAnimationFrame(draw); }, {passive:true});
      document.addEventListener('mouseleave', ()=> cursor.classList.remove('visible'));
      document.addEventListener('mouseover', e => { if (e.target.closest('button,a,.desktop-icon,.window-btn')) cursor.classList.add('hovering'); else cursor.classList.remove('hovering'); });
    }

    let pong = null;
    function setupPong(win){
      const canvas = win.querySelector('#pongCanvas');
      const ctx = canvas.getContext('2d');
      const status = win.querySelector('#pongStatus');
      const startBtn = win.querySelector('#pongStartBtn');
      const keys = new Set();
      pong = {
        canvas, ctx, status,
        left:{x:18,y:160,w:10,h:76,vy:0,score:0},
        right:{x:512,y:160,w:10,h:76,vy:0,score:0},
        ball:{x:270,y:200,vx:4,vy:2,size:8},
        running:false,
        anim:null
      };
      function resetBall(dir=1){
        pong.ball.x = canvas.width/2; pong.ball.y = canvas.height/2;
        pong.ball.vx = 4 * dir; pong.ball.vy = (Math.random() > .5 ? 2 : -2);
      }
      function clampPaddles(){
        pong.left.y = Math.max(10, Math.min(canvas.height-pong.left.h-10, pong.left.y));
        pong.right.y = Math.max(10, Math.min(canvas.height-pong.right.h-10, pong.right.y));
      }
      function scorePoint(side){
        if (side === 'left') pong.left.score++; else pong.right.score++;
        if (pong.left.score >= 7 || pong.right.score >= 7){
          pong.running = false;
          status.textContent = pong.left.score > pong.right.score ? 'DCUT wins. Press restart.' : 'CPU wins. Press restart.';
        } else {
          status.textContent = `Score ${pong.left.score} - ${pong.right.score}`;
          resetBall(side === 'left' ? 1 : -1);
        }
      }
      function draw(){
        ctx.fillStyle = '#050505'; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.setLineDash([6,6]); ctx.beginPath(); ctx.moveTo(canvas.width/2, 10); ctx.lineTo(canvas.width/2, canvas.height-10); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = '#f25a63'; ctx.fillRect(pong.left.x, pong.left.y, pong.left.w, pong.left.h);
        ctx.fillStyle = '#6470ff'; ctx.fillRect(pong.right.x, pong.right.y, pong.right.w, pong.right.h);
        ctx.fillStyle = '#f2f2ea'; ctx.fillRect(pong.ball.x, pong.ball.y, pong.ball.size, pong.ball.size);
        ctx.fillStyle = '#e9ede7'; ctx.font = '24px monospace'; ctx.textAlign = 'center';
        ctx.fillText(String(pong.left.score), canvas.width/2 - 56, 36);
        ctx.fillText(String(pong.right.score), canvas.width/2 + 56, 36);
      }
      function step(){
        if (!pong.running) { draw(); return; }
        const speed = 5;
        if (keys.has('w') || keys.has('ArrowUp')) pong.left.y -= speed;
        if (keys.has('s') || keys.has('ArrowDown')) pong.left.y += speed;
        // simple AI
        const aiCenter = pong.right.y + pong.right.h/2;
        const target = pong.ball.y + pong.ball.size/2;
        if (aiCenter < target - 6) pong.right.y += 3.4;
        if (aiCenter > target + 6) pong.right.y -= 3.4;
        clampPaddles();
        pong.ball.x += pong.ball.vx;
        pong.ball.y += pong.ball.vy;
        if (pong.ball.y <= 10 || pong.ball.y + pong.ball.size >= canvas.height - 10) pong.ball.vy *= -1;
        const b = pong.ball;
        const lp = pong.left; const rp = pong.right;
        if (b.x <= lp.x + lp.w && b.x + b.size >= lp.x && b.y + b.size >= lp.y && b.y <= lp.y + lp.h && pong.ball.vx < 0){
          pong.ball.vx = Math.abs(pong.ball.vx) + 0.2;
          pong.ball.vy += ((b.y + b.size/2) - (lp.y + lp.h/2)) * 0.05;
        }
        if (b.x + b.size >= rp.x && b.x <= rp.x + rp.w && b.y + b.size >= rp.y && b.y <= rp.y + rp.h && pong.ball.vx > 0){
          pong.ball.vx = -Math.abs(pong.ball.vx) - 0.2;
          pong.ball.vy += ((b.y + b.size/2) - (rp.y + rp.h/2)) * 0.05;
        }
        if (pong.ball.x < -20) scorePoint('right');
        if (pong.ball.x > canvas.width + 20) scorePoint('left');
        draw();
        pong.anim = requestAnimationFrame(step);
      }
      function restart(){
        pong.left.score = 0; pong.right.score = 0; pong.left.y = 160; pong.right.y = 160; pong.running = true; status.textContent = 'Score 0 - 0'; resetBall(Math.random() > .5 ? 1 : -1);
        cancelAnimationFrame(pong.anim); step();
      }
      startBtn.addEventListener('click', restart);
      window.addEventListener('keydown', e => {
        if (['w','s','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
        if (e.key === ' ') restart();
        keys.add(e.key);
      });
      window.addEventListener('keyup', e => keys.delete(e.key));
      win.restartGame = restart;
      draw();
    }
    function startPong(){ if (pongWindow && pongWindow.restartGame) pongWindow.restartGame(); }
  </script>
</body>
</html>
