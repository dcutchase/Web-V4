<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>DCUT</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="world-plate" aria-hidden="true"></div>
  <div class="center-matte" aria-hidden="true"></div>
  <div class="pixel-noise" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <div class="pixel-cursor" id="pixelCursor" aria-hidden="true">
    <span class="cursor-core"></span>
    <span class="cursor-corner c1"></span>
    <span class="cursor-corner c2"></span>
    <span class="cursor-corner c3"></span>
    <span class="cursor-corner c4"></span>
  </div>

  <main id="page">
    <section class="archive">
      <div class="reel-anchor" id="reelAnchor">
        <img class="reel-sprite" id="reelSprite" src="assets/reel-8bit.png" alt="">
      </div>

      <div class="film-mouth" aria-hidden="true"></div>

      <div class="film-reveal" id="filmReveal">
        <div class="film" id="film"></div>
      </div>

      <div class="scroll-track" id="scrollTrack" aria-hidden="true"></div>
    </section>

    <footer class="social-hub" aria-label="DCUT social links">
      <div class="social-shell">
        <div class="social-kicker">DCUT NETWORK</div>
        <div class="social-title">SOCIAL LINKS</div>

        <div class="social-grid">
          <a class="social-card" href="https://www.instagram.com/dcut.chase/" target="_blank" rel="noopener noreferrer">
            <span class="social-platform">INSTAGRAM</span>
            <span class="social-handle">@dcut.chase</span>
            <span class="social-arrow">↗</span>
          </a>

          <a class="social-card" href="https://www.instagram.com/dcut.collective/" target="_blank" rel="noopener noreferrer">
            <span class="social-platform">INSTAGRAM</span>
            <span class="social-handle">@dcut.collective</span>
            <span class="social-arrow">↗</span>
          </a>

          <a class="social-card" href="https://www.tiktok.com/@dcut.chase" target="_blank" rel="noopener noreferrer">
            <span class="social-platform">TIKTOK</span>
            <span class="social-handle">@dcut.chase</span>
            <span class="social-arrow">↗</span>
          </a>

          <a class="social-card" href="https://www.tiktok.com/@dcut.collective" target="_blank" rel="noopener noreferrer">
            <span class="social-platform">TIKTOK</span>
            <span class="social-handle">@dcut.collective</span>
            <span class="social-arrow">↗</span>
          </a>
        </div>

        <div class="social-status">
          <span class="status-light"></span>
          <span>NETWORK ONLINE</span>
        </div>

        <div class="social-brand">
          <span>DCUT</span>
          <div><i></i><i></i><i></i><i></i></div>
        </div>
      </div>
    </footer>
  </main>

  <script src="site-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
