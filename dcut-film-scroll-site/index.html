<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DCUT</title>
  <meta name="theme-color" content="#020202" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="noise"></div>
  <div class="scanlines"></div>
  <div class="room-glow"></div>

  <main>
    <div class="reel-stage" aria-hidden="true">
      <div class="reel-glow"></div>
      <div class="reel-wrap">
        <div class="reel-edge">
          <div class="dcut-mark">
            <span>D</span><span>C</span><span>U</span><span>T</span>
          </div>
        </div>
        <div class="reel" id="reel">
          <div class="hub"></div>
          <i class="hole h1"></i><i class="hole h2"></i><i class="hole h3"></i>
          <i class="hole h4"></i><i class="hole h5"></i><i class="hole h6"></i>
        </div>
      </div>
    </div>

    <div class="film-leader" aria-hidden="true"><div class="leader-center"></div></div>
    <section class="film" id="film" aria-label="DCUT creative categories"></section>
  </main>

  <script src="site-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
